# config.example.yaml
mode: "project"  # arxiv | single | project

# Input
input:
  url: "https://arxiv.org/..."  # arxiv URL or local path
  path: "./demo/document.tex"        # for mode=single
  dir: "./demo/"          # for mode=project

# Output
output:
  dir: "./output"
  compile: true

# Translation settings
translation:
  target_lang: "Chinese"
  chunk_size: 3800
  use_cot: false
  fix_hyphen: true
  fix_command_adhesion: true

# LLM settings
llm:
  backend: "openai"
  model: "gpt-4o-mini"
  api_key_env: "LLM_API_KEY"
  base_url: "https://api.openai.com/v1/"
  temperature: 0.1
  top_p: 0.9
  max_concurrent: 15
  max_retries: 3